name: GitHub Pages Yayımlama

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu İndir (Checkout)
        uses: actions/checkout@v4

      - name: GitHub Pages Yapılandırması
        uses: actions/configure-pages@v5

      - name: Statik Dosyaları Yükle
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: GitHub Pages Üzerinde Yayımla
        id: deployment
        uses: actions/deploy-pages@v4
